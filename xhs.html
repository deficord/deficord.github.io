<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1f2329; --sub:#8a9099;
    --line:#e7e9ee; --red:#ff2e4d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  header{padding:18px 20px 10px; background:var(--panel); border-bottom:1px solid var(--line);}
  header h1{margin:0; font-size:18px; font-weight:700;}
  header p{margin:4px 0 0; font-size:12px; color:var(--sub);}
  .wrap{display:flex; gap:18px; padding:18px 20px; align-items:flex-start; flex-wrap:wrap;}
  .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  select,button{font-size:13px; padding:8px 12px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink); cursor:pointer;}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button:hover{opacity:.92;}
  .left{flex:0 0 auto;}
  .right{flex:1 1 320px; min-width:300px;}
  .pages{display:flex; gap:14px; flex-wrap:wrap;}

  /* ===== 通用卡片 300x400 ≈ 3:4 ===== */
  .page{width:300px; height:400px; background:#fff; border-radius:16px; position:relative;
    overflow:hidden; box-shadow:0 6px 22px rgba(0,0,0,.10); padding:22px 20px;
    display:flex; flex-direction:column;}
  .page .badge{align-self:flex-start; font-size:12px; font-weight:700; color:#fff;
    padding:4px 10px; border-radius:999px; margin-bottom:14px;}
  .page .label{font-size:12px; color:var(--sub); margin-bottom:8px; font-weight:600;}
  .page .body{flex:1; display:flex; align-items:flex-start; padding-top:6px; overflow:hidden;}
  .page .txt{font-size:21px; line-height:1.5; font-weight:600; word-break:break-word;}
  .page.cover .txt{font-size:27px; line-height:1.4; font-weight:800;}
  .page .foot{font-size:11px; color:var(--sub); margin-top:10px;}
  .page .pagenum{position:absolute; right:16px; bottom:12px; font-size:11px; color:var(--sub);}
  .page .hl{color:var(--red); font-weight:800;}

  /* ===== 小红书味皮肤（默认启用）===== */
  .page.xhs{border:1px solid #ffe1e6; border-radius:22px;
    box-shadow:0 10px 28px rgba(255,46,77,.12); padding-top:30px;}
  .page.xhs .topbar{position:absolute; top:0; left:0; right:0; height:7px;
    background:linear-gradient(90deg,var(--c,var(--red)),#ff9aae);}
  .page.xhs .badge{background:var(--red); box-shadow:0 2px 6px rgba(255,46,77,.3);}
  .page.xhs.cover{background:linear-gradient(165deg,#ffffff 56%, var(--c,var(--red)) 260%);}
  .page.xhs .txt{font-weight:800; letter-spacing:.2px;}
  .page.xhs .hl{color:#e01030; font-weight:800;}
  .page.xhs.cover .txt{-webkit-text-stroke:.4px rgba(0,0,0,.05);
    text-shadow:0 2px 10px rgba(0,0,0,.08);}
  .page.xhs .qbox{background:#fff0f3; border-left:4px solid var(--red);
    border-radius:0 12px 12px 0; padding:12px 12px 12px 14px;
    font-size:18px; font-weight:700; color:#c8123a;}
  .page.xhs .foot{color:#ff5c77; font-weight:600;}
  .page.xhs .emojirow{font-size:20px; letter-spacing:5px; text-align:center;
    padding:8px 0 2px; opacity:.92;}

  .side{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px;}
  .side h3{margin:0 0 10px; font-size:14px;}
  .side textarea{width:100%; min-height:120px; border:1px solid var(--line); border-radius:10px;
    padding:10px; font-size:13px; line-height:1.6; resize:vertical; font-family:inherit;}
  .tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .tag{background:#fff4f5; color:var(--accent); font-size:12px; padding:5px 10px; border-radius:999px;}
  .tip{font-size:12px; color:var(--sub); line-height:1.7;}
  .row{display:flex; gap:8px; align-items:center; margin-top:8px;}
  .note{font-size:12px; color:var(--sub); margin-top:8px; line-height:1.6;}
  .src{font-size:11px; color:var(--sub); margin-top:6px;}
</style>

<header>

    </div>
  </div>

<script>
const TOPICS = [{"title":"别再被自律PUA了，普通人健身就图个不去医院","cat":"健身","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我健身是为了不去医院，结果练出一身伤——敢情医院和健身房是上下游。\n【3-12s 场景】每天下班累成狗，办了张年卡去健身房，结果最大运动量是在更衣室坐着刷手机，卡都快长霉了。\n【12-42s 口播】后来我想通了，咱普通人健身，真不是为了八块腹肌去走秀，是为了爬六楼不喘、抱娃不闪腰、体检报告少两个箭头。你就每天饭后遛弯二十分钟，比任何私教课都实在。别跟自己较劲，身体是用来伺候的，不是用来惩罚的。能走两步就别躺着刷剧，这就赢了。\n【42-50s 升华+互动】你今天动了吗？评论区报个数——敢说没动的，我敬你是老实人，明天咱一起从下楼开始。\n【画面/BGM/字幕】电影级真实感运动短视频，4K 超清，浅景深，自然光，生活流纪录片质感，真实微汗与微表情，不摆拍、无过度美颜，暖色调；画面：疲惫的上班族坐在健身房更衣室长椅上低头刷手机，身旁是落灰的年卡与运动包；中景手持跟拍，轻微呼吸感运镜，情绪松弛真实｜机位：手持或三脚架侧平拍｜景别：中景（全身/半身运动）+特写（汗珠/表情）｜运镜：跟拍动作或固定机位，节奏随动作｜表演：真人真实运动、微汗自然，不摆拍不美颜｜焦段：手机主摄广角(等效24-28mm)拍全身动作，汗珠/表情特写切2x(约50mm)，可用运动相机｜灯光：自然光为主，侧光勾肌肉线条与汗珠，避顶光鬼影，室内补暖光不刺眼｜机位高度：侧平拍腰胯高度，跟拍随动作起伏｜收音：领夹麦收喘息与环境声，户外加防风毛套，BGM压至15%｜剪辑节奏：跟拍随动作卡点，每组动作切1个特写，高潮处0.5x慢动作｜BGM：轻快电子｜字幕：大字字幕，关键句高亮，70% 静音可懂"},{"title":"跑步机买回家，最后都成了晾衣架","cat":"健身","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我家的跑步机，最大运动量是在上面晾了三十双袜子——也算运动了，晾衣运动。\n【3-12s 场景】新婚那年信了在家就能瘦，结果机器成了全家最高的置物架，连猫都上去睡觉。\n【12-42s 口播】说真的，居家健身最大的敌人不是懒，是太方便放弃。你坐那伸手就能拿零食，谁还跑？真想动，别整虚的，下楼走两圈、爬楼梯、跟刘畊宏跳两段，比摆个机器吃灰强。别为仪式感花钱，为动起来花钱才值。先让身体热起来，再谈装备。\n【42-50s 升华+互动】你家吃灰的健身器材是啥？评论区晒图，我看看谁家比我家跑步机还能装。\n【画面/BGM/字幕】电影级真实感运动短视频，4K 超清，浅景深，自然光，生活流纪录片质感，真实微汗与微表情，不摆拍、无过度美颜，暖色调；画面：家用跑步机上堆满快递盒与杂物，真人站在一旁无奈苦笑、摇头；俯拍全景，画面带自嘲喜剧感｜机位：手持或三脚架侧平拍｜景别：中景（全身/半身运动）+特写（汗珠/表情）｜运镜：跟拍动作或固定机位，节奏随动作｜表演：真人真实运动、微汗自然，不摆拍不美颜｜焦段：手机主摄广角(等效24-28mm)拍全身动作，汗珠/表情特写切2x(约50mm)，可用运动相机｜灯光：自然光为主，侧光勾肌肉线条与汗珠，避顶光鬼影，室内补暖光不刺眼｜机位高度：侧平拍腰胯高度，跟拍随动作起伏｜收音：领夹麦收喘息与环境声，户外加防风毛套，BGM压至15%｜剪辑节奏：跟拍随动作卡点，每组动作切1个特写，高潮处0.5x慢动作｜BGM：欢快｜字幕：字幕吐槽，关键句高亮，70% 静音可懂"},{"title":"深蹲伤膝盖？是你姿势丑，不是深蹲的锅","cat":"健身","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我妈说深蹲伤膝盖，我让她蹲个标准的看看——她蹲成了扎马步。\n【3-12s 场景】小区里看大爷深蹲像在拔萝卜，膝盖内扣成内八字，那不伤才怪。\n【12-42s 口播】深蹲本身不背锅，错的是你塌腰撅屁股还硬蹲。记住仨字：腰挺直、膝对齐、屁股往后坐像找椅子。能蹲多低蹲多低，别逞强。膝盖不舒服就退阶，靠墙静蹲更安全。健身不是比谁狠，是比谁活得久。姿势对了，六十岁还能蹲下来系鞋带，这比啥都强。\n【42-50s 升华+互动】你蹲过最丑的姿势是啥？评论区描述一下，我挑三个最离谱的下一期专门教。\n【画面/BGM/字幕】电影级真实感运动短视频， ｜景别：近景（亲子同框/互动）｜运镜：柔光固定或轻晃｜表演：温情自然，不摆拍｜焦段：50mm人像感(手机2x)，亲子同框用广角｜灯光：柔光(窗边自然光/柔灯)，无硬阴影，暖调不刺眼｜机位高度：蹲平孩子视线平视，不俯视｜收音：室内安静直录，孩子声用指向麦，保留生活杂音｜剪辑节奏：柔光固定或轻晃，情绪点慢镜，对话留白不切太碎｜BGM：抒情｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"陪写作业，是亲妈变后妈现场","cat":"家庭教育","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我辅导一道加减法，从温柔到咆哮只用了八分钟，血压直接拉满——这道题，考的是我的命。\n【3-12s 场景】邻居听见我吼，以为我家在杀猪，其实我只是在教进位。\n【12-42s 口播】陪读崩溃太正常了，但你得知道，吼完孩子怕，你也后悔。试试把你怎么这么笨换成这步咱再想想。作业是孩子的，别把他的焦虑背自己身上。实在上头，先去喝口水冷静。你的情绪稳，他才学得住。比起满分，他更需要一个不害怕犯错的你。今晚，咱温柔点。\n【42-50s 升华+互动】你陪写最崩溃的一次是啥？评论区吐，我陪你吼完再笑，别憋出病。\n【画面/BGM/字幕】温暖家庭纪实短片，4K，柔光，浅景深，真实亲子互动与微表情，暖色调，不摆拍；画面：真人在桌前辅导、表情从温柔到抓狂，孩子无辜抬头；自然光，中景喜剧感｜机位：手持或固定平视｜景别：近景（亲子同框/互动）｜运镜：柔光固定或轻晃｜表演：温情自然，不摆拍｜焦段：50mm人像感(手机2x)，亲子同框用广角｜灯光：柔光(窗边自然光/柔灯)，无硬阴影，暖调不刺眼｜机位高度：蹲平孩子视线平视，不俯视｜收音：室内安静直录，孩子声用指向麦，保留生活杂音｜剪辑节奏：柔光固定或轻晃，情绪点慢镜，对话留白不切太碎｜BGM：欢快｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"穷养富养，不如用爱养","cat":"家庭教育","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我纠结穷养富养，我妈说你小时候穿补丁不也长大了——物质堆不出幸福感，陪伴才填得满。\n【3-12s 场景】如今物质不缺了，孩子却越来越空，要啥给啥反而不珍惜。\n【12-42s 口播】物质堆不出幸福感，陪伴才填得满。你给他一百个玩具，不如周末陪他疯一下午。爱不是花钱，是花时间。孩子记不住你买啥，记得你陪他干的傻事。别用礼物补缺席，补不上的。把手机放下，眼睛看着他，这比啥班都值。富也罢穷也罢，人在心在就中。\n【42-50s 升华+互动】你童年最缺的是玩具还是陪伴？评论区聊聊，别再只给娃买玩具。\n【画面/BGM/字幕】温暖家庭纪实短片，4K，柔光，浅景深，真实亲子互动与微表情，暖色调，不摆拍；画面：亲子在地上一起搭积木、笑作一团；暖光，中景手持，质朴温情｜机位：手持或固定平视｜景别：近景（亲子同框/互动）｜运镜：柔光固定或轻晃｜表演：温情自然，不摆拍｜焦段：50mm人像感(手机2x)，亲子同框用广角｜灯光：柔光(窗边自然光/柔灯)，无硬阴影，暖调不刺眼｜机位高度：蹲平孩子视线平视，不俯视｜收音：室内安静直录，孩子声用指向麦，保留生活杂音｜剪辑节奏：柔光固定或轻晃，情绪点慢镜，对话留白不切太碎｜BGM：治愈｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"孩子顶嘴，其实是长大了","cat":"家庭教育","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我儿子十岁开始顶嘴，我气得跳脚，我爸说好事有主见了——当年我也这么气过我爸。\n【3-12s 场景】回想我小时候唯唯诺诺，被欺负的样，突然盼着他能顶回来。\n【12-42s 口播】别把顶嘴当大逆不道，那是他在练习表达和边界。你得教他怎么好好说，而不是闭嘴别顶。会争辩的孩子，将来不容易被欺负、被带偏。给他说话的尊重，他才学会尊重别人。当然，没大没小得管，但别一棍子打死。让他敢说，也教他会说。这比听话重要。\n【42-50s 升华+互动】你小时候敢顶嘴吗？评论区说，咱这代当爹妈，进步就进步在这。\n【画面/BGM/字幕】温暖家庭纪实短片，4K，柔光，浅景深，真实亲子互动与微表情，暖色调，不摆拍；画面：亲子面对面交谈，孩子认真表达、真人由愣到欣慰；柔光近景｜机位：手持或固定平视｜景别：近景（亲子同框/互动）｜运镜：柔光固定或轻晃｜表演：温情自然，不摆拍｜焦段：50mm人像感(手机2x)，亲子同框用广角｜灯光：柔光(窗边自然光/柔灯)，无硬阴影，暖调不刺眼｜机位高度：蹲平孩子视线平视，不俯视｜收音：室内安静直录，孩子声用指向麦，保留生活杂音｜剪辑节奏：柔光固定或轻晃，情绪点慢镜，对话留白不切太碎｜BGM：抒情｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"别把孩子的人生，活成你的遗憾","cat":"家庭教育","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我想让他学琴圆我梦，他哭了一学期，我才发现——这是我的瘾，不是他的。\n【3-12s 场景】看他弹琴像上刑，我想起被我妈逼写字的自己，瞬间醒了。\n【12-42s 口播】多少家长把娃当重生机会，把自己没实现的硬塞给他。可他是独立的人，不是你的续集。观察他喜欢啥、擅长啥，顺着来，别按你的剧本演。他开心比有出息更金贵。你先活好自己，他自然学样。别用爱绑架，用爱放手。让他做自己，你做你。\n【42-50s 升华+互动】你有没有把遗憾强加给孩子？评论区反思，咱尽量别，让他做自己。\n【画面/BGM/字幕】温暖家庭纪实短片，4K，柔光，浅景深，真实亲子互动与微表情，暖色调，不摆拍；画面：真人看着孩子玩耍背影出神、若有所思；柔光，慢推镜头｜机位：手持或固定平视｜景别：近景（亲子同框/互动）｜运镜：柔光固定或轻晃｜表演：温情自然，不摆拍｜焦段：50mm人像感(手机2x)，亲子同框用广角｜灯光：柔光(窗边自然光/柔灯)，无硬阴影，暖调不刺眼｜机位高度：蹲平孩子视线平视，不俯视｜收音：室内安静直录，孩子声用指向麦，保留生活杂音｜剪辑节奏：柔光固定或轻晃，情绪点慢镜，对话留白不切太碎｜BGM：舒缓｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"爸爸的参与，比妈妈的爱更稀缺","cat":"家庭教育","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我老公下班往沙发一瘫，娃喊爹像喊空气，我一人扛成超人——丧偶式育儿，是很多家的现状。\n【3-12s 场景】有回他带娃半天，进来问我奶粉怎么冲，我既好气又好笑。\n【12-42s 口播】丧偶式育儿太常见，可孩子要的是爹妈都在。爸爸别觉得带娃是帮忙，那是本分。你陪他踢球、读书、犯错时接住他，他才有完整的底气。妈妈不是天生超人，你搭把手，家就轻松一半。从今晚起，爹也上岗。孩子记一辈子的是你陪他的那些下午。\n【42-50s 升华+互动】你家娃他爹参与多吗？评论区催他，@出来干活，别让妈一个人扛。\n【画面/BGM/字幕】温暖家庭纪实短片，4K，柔光，浅景深，真实亲子互动与微表情，暖色调，不摆拍；画面：爸爸笨拙地给孩子冲奶粉、手忙脚乱；暖光，中景，轻松幽默｜机位：手持或固定平视｜景别：近景（亲子同框/互动）｜运镜：柔光固定或轻晃｜表演：温情自然，不摆拍｜焦段：50mm人像感(手机2x)，亲子同框用广角｜灯光：柔光(窗边自然光/柔灯)，无硬阴影，暖调不刺眼｜机位高度：蹲平孩子视线平视，不俯视｜收音：室内安静直录，孩子声用指向麦，保留生活杂音｜剪辑节奏：柔光固定或轻晃，情绪点慢镜，对话留白不切太碎｜BGM：生活｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"性教育别等出事才讲","cat":"家庭教育","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我小时候问从哪来，我妈说捡的，害我自卑好多年——一句谎，赔了我整个童年。\n【3-12s 场景】如今我儿子问，我认真讲，他哦一声跑去玩，比我想的淡定。\n【12-42s 口播】别讳莫如深，你不说，坏人就趁虚而入。用他能懂的话，讲身体界限、隐私部位不准别人碰、不舒服要喊要告。越早讲越自然，拖到青春期就尬了。保护孩子，从大方谈性开始。别让不好意思成隐患。你是他第一道防线，别缺岗。\n【42-50s 升华+互动】你当年被怎么糊弄过来的？评论区说，咱这代，讲明白。\n【画面/BGM/字幕】温暖家庭纪实短片，4K，柔光，浅景深，真实亲子互动与微表情，暖色调，不摆拍；画面：亲子坦然坐谈，真人温和讲解、孩子平静倾听；柔光近景，自然不尬｜机位：手持或固定平视｜景别：近景（亲子同框/互动）｜运镜：柔光固定或轻晃｜表演：温情自然，不摆拍｜焦段：50mm人像感(手机2x)，亲子同框用广角｜灯光：柔光(窗边自然光/柔灯)，无硬阴影，暖调不刺眼｜机位高度：蹲平孩子视线平视，不俯视｜收音：室内安静直录，孩子声用指向麦，保留生活杂音｜剪辑节奏：柔光固定或轻晃，情绪点慢镜，对话留白不切太碎｜BGM：舒缓｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"失败也要让孩子看见","cat":"家庭教育","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我工作搞砸在家叹气，儿子说爸爸也会错啊，我反而松了——原来示弱，比装完美管用。\n【3-12s 场景】原来我一直装完美，他以为大人不会输，压力比我还大。\n【12-42s 口播】别在孩子面前死撑完美，那会让他怕犯错。让他看见你输了、难过了、又爬起来，他才学得到韧性。失败不是丢人，是常态。你坦坦荡荡，他大大方方。告诉他：错了改就好，没人一直赢。这堂课，比满分值钱。咱一起，输得起。\n【42-50s 升华+互动】你最近一次搞砸了是啥？评论区说，给孩子做榜样，错不可怕。\n【画面/BGM/字幕】温暖家庭纪实短片，4K，柔光，浅景深，真实亲子互动与微表情，暖色调，不摆拍；画面：父子互动，真人示弱叹气、孩子递来安慰；暖光，情绪真实｜机位：手持或固定平视｜景别：近景（亲子同框/互动）｜运镜：柔光固定或轻晃｜表演：温情自然，不摆拍｜焦段：50mm人像感(手机2x)，亲子同框用广角｜灯光：柔光(窗边自然光/柔灯)，无硬阴影，暖调不刺眼｜机位高度：蹲平孩子视线平视，不俯视｜收音：室内安静直录，孩子声用指向麦，保留生活杂音｜剪辑节奏：柔光固定或轻晃，情绪点慢镜，对话留白不切太碎｜BGM：抒情｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"童年的伤，要用一生去哄","cat":"家庭教育","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我都三十了，还常梦到被我爸揍，醒来心口闷——原生家庭的印子，不是成年就自动消。\n【3-12s 场景】发誓不当那种爹，可吼孩子那一秒，竟听见了我爸的腔调，吓醒自己。\n【12-42s 口播】原生家庭的印子深，但你能选择不传给下一代。觉察到自己在重复，就停一下、换个方式。你先把自己重新养一遍，再好好养娃。别怪父母，也别认命，断裂在这一代止住。你温柔了，孩子就松了。这活儿难，但值得。为了他，也为了当年的你。\n【42-50s 升华+互动】你最想对小时候的自己说啥？评论区写，我替你拥抱他，也抱抱自己。\n【画面/BGM/字幕】温暖家庭纪实短片，4K，柔光，浅景深，真实亲子互动与微表情，暖色调，不摆拍；画面：怀旧画面：童年场景与真人如今反思交叠；柔光，运镜舒缓含蓄｜机位：手持或固定平视｜景别：近景（亲子同框/互动）｜运镜：柔光固定或轻晃｜表演：温情自然，不摆拍｜焦段：50mm人像感(手机2x)，亲子同框用广角｜灯光：柔光(窗边自然光/柔灯)，无硬阴影，暖调不刺眼｜机位高度：蹲平孩子视线平视，不俯视｜收音：室内安静直录，孩子声用指向麦，保留生活杂音｜剪辑节奏：柔光固定或轻晃，情绪点慢镜，对话留白不切太碎｜BGM：治愈｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"吵架最怕的不是吵，是你猜","cat":"高情商恋爱关系","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我媳妇生气我猜了八遍没对，最后她说你根本不关心我——她要的是态度，不是答案，男人总答错题。\n【3-12s 场景】那晚我逻辑满分、情商为零，成功把小事吵成冷战三天。\n【12-42s 口播】男人啊，别跟女人讲逻辑，她生气时你越讲理她越火。记住三句话：我在听、我懂你、咱一起想办法。比转五百二十块管用。感情里最贵的不是礼物，是你愿不愿意弯下腰接住她的情绪。低头不丢人，冷战才伤身。下次她炸了，先抱再问，别先辩。\n【42-50s 升华+互动】你对象最吃你哪一套？评论区偷偷告诉我，我替你保密，顺便教直男们。\n【画面/BGM/字幕】情感生活流短片，4K，柔光，浅景深，真实情侣互动微表情，暖色调，自然不造作；画面：夫妻居家对话，真人无奈扶额、对方语气激动；暖光，中景，真实生活感｜机位：手持或固定平视｜景别：近景（双人互动）｜运镜：柔光固定或轻晃｜表演：自然互动，不造作｜焦段：50mm人像(手机2x)，双人同框用广角｜灯光：柔光暖调，窗边/暖灯，避冲突硬光｜机位高度：平视眼高，过肩拍互动｜收音：双人各一领夹麦或指向麦收对话｜剪辑节奏：轻晃生活流，对视/牵手处慢镜，情绪留白｜BGM：生活｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"直男的浪漫，就是记住她说过的话","cat":"高情商恋爱关系","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我随口说她爱喝某奶茶，两周后买给她，她激动发朋友圈——就这？对，就这就够。\n【3-12s 场景】我搞不懂，我送过更贵的，都不如这句我记得让她开心。\n【12-42s 口播】女人要的不是多贵，是你在乎。她随口提的想要、爱吃、烦的事，你记一下，偶尔兑现，比节日硬凑的花强百倍。细节是爱的证据。别总说不知道送啥，她早把答案说过一百遍了，你没听。把耳朵打开，浪漫自然来。记小事，暖大心。\n【42-50s 升华+互动】你对象念叨过啥你一直没办？评论区坦白，赶紧去，别等她不念了。\n【画面/BGM/字幕】情感生活流短片，4K，柔光，浅景深，真实情侣互动微表情，暖色调，自然不造作；画面：真人突然递上对方随口提过的小礼物，对方惊喜；暖光特写，甜暖｜机位：手持或固定平视｜景别：近景（双人互动）｜运镜：柔光固定或轻晃｜表演：自然互动，不造作｜焦段：50mm人像(手机2x)，双人同框用广角｜灯光：柔光暖调，窗边/暖灯，避冲突硬光｜机位高度：平视眼高，过肩拍互动｜收音：双人各一领夹麦或指向麦收对话｜剪辑节奏：轻晃生活流，对视/牵手处慢镜，情绪留白｜BGM：治愈｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"作，是试探；冷，是失望","cat":"高情商恋爱关系","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我前任总作，我以为她麻烦，后来才懂——她作是因为还信你会哄，不作的那天，是凉了。\n【3-12s 场景】等她不作了、不闹了，那段关系也凉透了，连架都懒得吵。\n【12-42s 口播】别嫌对象作，作是还想要你注意。真失望的人，是沉默、是算了吧。珍惜她愿意闹的你，说明还把你当自己人。你多给点回应，她少点折腾。感情是来回的，你冷她就更冷。把又怎么了换成咋了宝贝，风向立刻变。懂这点的男人，家都暖。\n【42-50s 升华+互动】你对象作的时候你咋处理的？评论区取经，别等她冷了才慌。\n【画面/BGM/字幕】情感生活流短片，4K，柔光，浅景深，真实情侣互动微表情，暖色调，自然不造作；画面：情侣间一方闹脾气、另一方沉默，气氛由闹到冷；中景，柔光，情绪渐沉｜机位：手持或固定平视｜景别：近景（双人互动）｜运镜：柔光固定或轻晃｜表演：自然互动，不造作｜焦段：50mm人像(手机2x)，双人同框用广角｜灯光：柔光暖调，窗边/暖灯，避冲突硬光｜机位高度：平视眼高，过肩拍互动｜收音：双人各一领夹麦或指向麦收对话｜剪辑节奏：轻晃生活流，对视/牵手处慢镜，情绪留白｜BGM：抒情｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"异地恋靠的不是爱，是话费","cat":"高情商恋爱关系","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我和对象异地两年，话费月月两百起，视频比见面多——异地恋，是拿话费硬撑的。\n【3-12s 场景】有回我发烧她隔着屏急哭，那一刻觉得——距离真磨人但也真验人。\n【12-42s 口播】异地最怕的不是远，是不参与。每天固定聊聊，哪怕发个吃了吗也别断联。分享废话才是亲密，别等有事才找。信任给够，怀疑就少。熬过异地的人，结了婚都稳。你要是也在异地，抱一下，辛苦了。把我想你说出口，不丢人。\n【42-50s 升华+互动】你异地过多久？评论区报数，给还在熬的打气，熬过来的都是真爱。\n【画面/BGM/字幕】情感生活流短片，4K，柔光，浅景深，真实情侣互动微表情，暖色调，自然不造作；画面：真人深夜对着手机视频通话、隔着屏幕笑；冷调，近景，思念感｜机位：手持或固定平视｜景别：近景（双人互动）｜运镜：柔光固定或轻晃｜表演：自然互动，不造作｜焦段：50mm人像(手机2x)，双人同框用广角｜灯光：柔光暖调，窗边/暖灯，避冲突硬光｜机位高度：平视眼高，过肩拍互动｜收音：双人各一领夹麦或指向麦收对话｜剪辑节奏：轻晃生活流，对视/牵手处慢镜，情绪留白｜BGM：温情｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"妈宝男，是婚姻里的隐形坑","cat":"高情商恋爱关系","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我同事啥都听他妈的，媳妇坐月子他妈说了算，他只当传声筒——结婚是两个人，不是和婆婆。\n【3-12s 场景】那家吵起来，他永远我妈也是为好，媳妇寒心透顶。\n【12-42s 口播】结婚是两个人过，不是和婆婆过。你妈再对，也得你媳妇优先。该护的得护，别让老婆夹在中间。妈宝不是孝，是没担当。把小家立起来，老人才放心。你态度硬一点，家里就稳一点。记住，你娶的是妻子不是室友。该扛的，自己上。\n【42-50s 升华+互动】你身边有妈宝男吗？评论区避雷，也提醒男的，小家得自己立。\n【画面/BGM/字幕】情感生活流短片，4K，柔光，浅景深，真实情侣互动微表情，暖色调，自然不造作；画面：家庭场景，真人夹在母亲与伴侣间左右为难；暖光，中景，张力真实｜机位：手持或固定平视｜景别：近景（双人互动）｜运镜：柔光固定或轻晃｜表演：自然互动，不造作｜焦段：50mm人像(手机2x)，双人同框用广角｜灯光：柔光暖调，窗边/暖灯，避冲突硬光｜机位高度：平视眼高，过肩拍互动｜收音：双人各一领夹麦或指向麦收对话｜剪辑节奏：轻晃生活流，对视/牵手处慢镜，情绪留白｜BGM：生活｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"微信已读不回，比吵架还伤人","cat":"高情商恋爱关系","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我发在忙吗，她三小时已读不回，我脑补了一出大戏——回个信儿很难吗？难的是在意。\n【3-12s 场景】后来她说手机没电，我才知道——我慌的不是消息，是怕被敷衍。\n【12-42s 口播】别小看及时回个话，那是我在乎你的最低成本。忙可以回等下，别晾着人瞎想。感情里最怕的不是吵，是敷衍。你多用半分钟，对方少慌半天。也别总等对方主动，你先发个到公司了，日子就暖了。小事见人心，回个信儿不难。\n【42-50s 升华+互动】你最怕对象哪句不回？评论区说，咱都懂这慌，下次别让人慌。\n【画面/BGM/字幕】情感生活流短片，4K，柔光，浅景深，真实情侣互动微表情，暖色调，自然不造作；画面：真人盯着手机聊天界面、已读不回的焦虑侧脸；冷调特写，反差强烈｜机位：手持或固定平视｜景别：近景（双人互动）｜运镜：柔光固定或轻晃｜表演：自然互动，不造作｜焦段：50mm人像(手机2x)，双人同框用广角｜灯光：柔光暖调，窗边/暖灯，避冲突硬光｜机位高度：平视眼高，过肩拍互动｜收音：双人各一领夹麦或指向麦收对话｜剪辑节奏：轻晃生活流，对视/牵手处慢镜，情绪留白｜BGM：抒情｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"彩礼不是卖身，是态度","cat":"高情商恋爱关系","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我哥结婚为彩礼掰扯半年，嫂子说我要的是你家人当我是人——钱是表态，情才是地基。\n【3-12s 场景】钱谈妥了，心没谈妥，进门还是寒。后来我哥一家慢慢暖，才真成家。\n【12-42s 口播】彩礼这事儿，别上纲上线也别不当回事。女方要的是被重视，不是漫天要价；男方也别抠到寒酸，显得不重视。俩家坐下来好好谈，把话说透，比互怼强。婚姻开头顺了，后面好走。钱是表态，情才是地基。都退一步，喜事别变事故。\n【42-50s 升华+互动】你对彩礼咋看？评论区聊聊，理性点别上头，别让喜事变事故。\n【画面/BGM/字幕】情感生活流短片，4K，柔光，浅景深，真实情侣互动微表情，暖色调，自然不造作；画面：两家围坐座谈，真人温和沟通、气氛渐松；暖光，中景，真实克制｜机位：手持或固定平视｜景别：近景（双人互动）｜运镜：柔光固定或轻晃｜表演：自然互动，不造作｜焦段：50mm人像(手机2x)，双人同框用广角｜灯光：柔光暖调，窗边/暖灯，避冲突硬光｜机位高度：平视眼高，过肩拍互动｜收音：双人各一领夹麦或指向麦收对话｜剪辑节奏：轻晃生活流，对视/牵手处慢镜，情绪留白｜BGM：生活｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"前任是课，不是债","cat":"高情商恋爱关系","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我总拿前任比现任，现任忍了半年，一句那你找她去差点散——拿过去戳眼前，最蠢的事。\n【3-12s 场景】我才醒：拿过去的人戳眼前的人，是最蠢的事。\n【12-42s 口播】别拿前任当尺子量现任，每个人不一样，比来比去俩都伤。过去就过去了，你该谢她教过你，不是拿她刺人。把心放现任身上，日子才往前。总回头的人，走不远。珍惜眼前这个愿意陪你熬的，比怀念谁都强。关掉前任的窗，现任才进得来光。\n【42-50s 升华+互动】你干过拿前任比现任的傻事吗？评论区认个错，关掉前任的窗。\n【画面/BGM/字幕】情感生活流短片，4K，柔光，浅景深，真实情侣互动微表情，暖色调，自然不造作；画面：真人翻看旧物回忆、随后释然放下；柔光，近景，情绪由沉到轻｜机位：手持或固定平视｜景别：近景（双人互动）｜运镜：柔光固定或轻晃｜表演：自然互动，不造作｜焦段：50mm人像(手机2x)，双人同框用广角｜灯光：柔光暖调，窗边/暖灯，避冲突硬光｜机位高度：平视眼高，过肩拍互动｜收音：双人各一领夹麦或指向麦收对话｜剪辑节奏：轻晃生活流，对视/牵手处慢镜，情绪留白｜BGM：抒情｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"恋爱里的多喝热水，得会喝","cat":"高情商恋爱关系","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我对象痛经我只会喝热水，被怼你是复读机吗——关怀是行动，不是口号。\n【3-12s 场景】后来我学会煮姜茶、暖肚子、少说话多递手，她反而说你还会啊。\n【12-42s 口播】关怀不是口号，是行动。她不舒服，你别只动嘴，递杯热的、揉下背、把事办了，比一万句注意身体强。女人要的是你在不是你说。笨点没事，用心就行。把多喝热水换成我来了，画风立刻变。会疼人的男人，到哪都吃香。\n【42-50s 升华+互动】你对象不舒服时你咋做的？评论区交作业，别只动嘴。\n【画面/BGM/字幕】情感生活流短片，4K，柔光，浅景深，真实情侣互动微表情，暖色调，自然不造作；画面：真人煮姜茶、递到对方手里并轻揉肩背；暖光特写，温柔体贴｜机位：手持或固定平视｜景别：近景（双人互动）｜运镜：柔光固定或轻晃｜表演：自然互动，不造作｜焦段：50mm人像(手机2x)，双人同框用广角｜灯光：柔光暖调，窗边/暖灯，避冲突硬光｜机位高度：平视眼高，过肩拍互动｜收音：双人各一领夹麦或指向麦收对话｜剪辑节奏：轻晃生活流，对视/牵手处慢镜，情绪留白｜BGM：治愈｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"结婚久了，爱成了默契","cat":"高情商恋爱关系","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我和媳妇不咋说爱了，但她知道我鞋放哪、我知道她怕黑要留灯——爱到后头，是互相兜底。\n【3-12s 场景】有回我生病，她一夜起来三回给我倒水，啥也没说，全是默契。\n【12-42s 口播】别以为不甜言蜜语就是不爱，老夫老妻的爱藏在细节里。记得她口味、留盏灯、顺手扛下她的累，这比情人节转账实在。感情到后头，是互相兜底。别嫌平淡，平淡才是最稳的浪漫。你也对那人好点，毕竟是陪你到老的那个。老了有人管，是福。\n【42-50s 升华+互动】你和另一半的默契是啥？评论区晒，我酸了，但替你高兴。\n【画面/BGM/字幕】情感生活流短片，4K，柔光，浅景深，真实情侣互动微表情，暖色调，自然不造作；画面：居家默契画面：真人留灯、递水，无需言语；暖光，中景，平淡温暖｜机位：手持或固定平视｜景别：近景（双人互动）｜运镜：柔光固定或轻晃｜表演：自然互动，不造作｜焦段：50mm人像(手机2x)，双人同框用广角｜灯光：柔光暖调，窗边/暖灯，避冲突硬光｜机位高度：平视眼高，过肩拍互动｜收音：双人各一领夹麦或指向麦收对话｜剪辑节奏：轻晃生活流，对视/牵手处慢镜，情绪留白｜BGM：生活｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"别在气头上做决定","cat":"高情商恋爱关系","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我吵架冲动提过分手，说完就悔，幸亏她没松手——气头上的话，最伤人也最傻。\n【3-12s 场景】那晚我摔门而出，走了两步又回来——真走了就真没了。\n【12-42s 口播】气头上的话最伤人，也最容易办傻事。想说狠话时，先闭嘴、出门遛个弯、数到十。别让情绪替你做决定，睡一觉大多就过去了。感情里最贵的俩字是忍住。你退一步，风波就平。别拿分手当武器，用多了就真断。冷静点，家还在。\n【42-50s 升华+互动】你气头上干过最蠢的事是啥？评论区坦白，引以为戒，别拿分手当武器。\n【画面/BGM/字幕】情感生活流短片，4K，柔光，浅景深，真实情侣互动微表情，暖色调，自然不造作；画面：真人摔门而出又折返、深夜街头散步冷静；冷调，中景，情绪由紧到缓｜机位：手持或固定平视｜景别：近景（双人互动）｜运镜：柔光固定或轻晃｜表演：自然互动，不造作｜焦段：50mm人像(手机2x)，双人同框用广角｜灯光：柔光暖调，窗边/暖灯，避冲突硬光｜机位高度：平视眼高，过肩拍互动｜收音：双人各一领夹麦或指向麦收对话｜剪辑节奏：轻晃生活流，对视/牵手处慢镜，情绪留白｜BGM：舒缓｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"最好的爱，是让彼此做自己","cat":"高情商恋爱关系","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我逼对象改这改那，她快窒息，有天说在你面前我都不像我了——爱是容纳，不是改造。\n【3-12s 场景】那句话像耳光，我才懂——爱不是改造，是容纳。\n【12-42s 口播】别把对象当项目打磨，他是人不是产品。你爱的是他本来的样子，不是你理想的样子。少点控制多点空间，他舒服你才轻松。好的关系，是俩人都敢做自己还不愿离开。别用爱绑人，用爱松绑。你接纳他，他才靠近你。各活各的样，又黏在一块，这才叫搭伙。\n【42-50s 升华+互动】你有没有想把对象改成别样？评论区醒醒，接纳吧，他本来就好。\n【画面/BGM/字幕】情感生活流短片，4K，柔光，浅景深，真实情侣互动微表情，暖色调，自然不造作；画面：情侣各自做喜欢的事、相视一笑不干涉；柔光，中景，自在松弛｜机位：手持或固定平视｜景别：近景（双人互动）｜运镜：柔光固定或轻晃｜表演：自然互动，不造作｜焦段：50mm人像(手机2x)，双人同框用广角｜灯光：柔光暖调，窗边/暖灯，避冲突硬光｜机位高度：平视眼高，过肩拍互动｜收音：双人各一领夹麦或指向麦收对话｜剪辑节奏：轻晃生活流，对视/牵手处慢镜，情绪留白｜BGM：抒情｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"你喝的养生水，可能在养结石","cat":"知识科普类","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我邻居家大爷听苏打水防癌，一天灌八瓶，结果胃喝出毛病——养生水，可能养的是医院。\n【3-12s 场景】他信酸碱体质那套，花大钱买碱性水，最后医生一句话戳破——纯属编的。\n【12-42s 口播】今天说个冷的：人体根本没有酸性体质这说法，是商家编的词。酸碱平衡靠你的肾和肺，跟你喝啥水无关。真正该少碰的是高糖饮料和反复烧开的水。别交智商税，白开水才是永远的神。健康这事，少信朋友圈，多信三甲医院。下次谁再安利你碱性水，把这条甩他。\n【42-50s 升华+互动】你还信过啥离谱养生偏方？评论区说出来，咱一起避雷，别交智商税。\n【画面/BGM/字幕】实验室冷调风格科普短片，4K，冷白光与冷调布光，浅景深，干净冷色背景，临床科技冷感，纪录片质感，不暖调、去温馨；画面：实验室冷调台面，两只烧杯并排：左花哨碱性水、右普通白开水，真人（便装或白大褂）举杯端详露出疑惑；冷白光，中景，临床冷静克制｜机位：三脚架固定（台面平拍）｜景别：中景（演示）+特写（器材/对比）｜运镜：固定+关键处推近｜表演：冷静真实演示，冷调不暖｜焦段：微距/2x特写拍器材，中景用广角｜灯光：冷白光主光+补光去阴影，背景干净冷色，禁用暖光｜机位高度：三脚架台面平拍，关键处微推近｜收音：领夹麦收讲解，实验室安静，BGM冷调电子压至10%｜剪辑节奏：固定机位，关键步骤推近特写，字幕同步标注参数｜BGM：轻快｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"熬夜掉的头发，枸杞补不回来","cat":"知识科普类","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我一边熬夜一边泡枸杞，自我感动得像养生，其实全是自欺——枸杞救不了你作死。\n【3-12s 场景】连续一个月两点睡，发际线后退的速度比我工资涨得都快。\n【12-42s 口播】枸杞是好东西，但救不了你作死。熬夜伤的是免疫、代谢、内分泌，一杯枸杞水顶啥用？真想养生，先把觉睡够。二十三点到一点是修复黄金期，你刷剧它加班。少熬一晚，比吃十斤枸杞强。别用养生仪式感掩盖糟蹋身体。今晚，早点睡，比啥都灵。\n【42-50s 升华+互动】你昨晚几点睡的？评论区报时，睡不够的我去催，今晚早点睡。\n【画面/B 我是右脑型好多年，后来发现——你两个脑一起干活，没有只用左脑这回事。\n【3-12s 场景】什么开发右脑培训班，割的还是焦虑家长的韭菜。\n【12-42s 口播】科普：人做任何事都是全脑协作，没有只用左脑这回事。所谓左右脑性格测试，是伪科学娱乐。真正练脑子的是学习新东西、运动、社交，不是买什么开发课。别被标签框住自己和孩子。脑子越用越灵，多样刺激才好。少交智商税，多干实事。你聪明不靠脑型，靠肯学。\n【42-50s 升华+互动】你被左右脑忽悠过吗？评论区坦白，咱科学养脑，少交智商税。\n【画面/BGM/字幕】实验室冷调风格科普短片，4K，冷白光与冷调布光，浅景深，干净冷色背景，临床科技冷感，纪录片质感，不暖调、去温馨；画面：大脑结构示意图与真人思考表情叠加在冷调背景，轻松破除；冷白光，中景，幽默｜机位：三脚架固定（台面平拍）｜景别：中景（演示）+特写（器材/对比）｜运镜：固定+关键处推近｜表演：冷静真实演示，冷调不暖｜焦段：微距/2x特写拍器材，中景用广角｜灯光：冷白光主光+补光去阴影，背景干净冷色，禁用暖光｜机位高度：三脚架台面平拍，关键处微推近｜收音：领夹麦收讲解，实验室安静，BGM冷调电子压至10%｜剪辑节奏：固定机位，关键步骤推近特写，字幕同步标注参数｜BGM：轻快｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"吃的寒凉不是温度，是中医说法","cat":"知识科普类","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我妈不许我吃西瓜寒凉，大夏天我馋得慌，其实她是怕我拉肚子——寒凉是属性不是温度计。\n【3-12s 场景】中医的寒热是属性不是温度计，你冰西瓜吃多确实容易闹肚子。\n【12-42s 口播】科普一下：中医说的寒凉温热，是食物属性，不是物理温度。西瓜、梨性偏凉，肠胃弱的人多吃容易腹泻，但不是有毒。你体质好、适量吃没事。别一听寒凉就全禁，也别当饭造。了解自己身体，比背食谱强。寒热平衡，适量就好。听身体的反馈，它最诚实。\n【42-50s 升华+互动】你被寒凉限制过啥好吃的？评论区说，馋哭了吧，适量就行别死扛。\n【画面/BGM/字幕】实验室冷调风格科普短片，4K，冷白光与冷调布光，浅景深，干净冷色背景，临床科技冷感，纪录片质感，不暖调、去温馨；画面：冷调布光下西瓜、梨等凉性水果静物与真人适量品尝；冷白光，中景，去暖调｜机位：三脚架固定（台面平拍）｜景别：中景（演示）+特写（器材/对比）｜运镜：固定+关键处推近｜表演：冷静真实演示，冷调不暖｜焦段：微距/2x特写拍器材，中景用广角｜灯光：冷白光主光+补光去阴影，背景干净冷色，禁用暖光｜机位高度：三脚架台面平拍，关键处微推近｜收音：领夹麦收讲解，实验室安静，BGM冷调电子压至10%｜剪辑节奏：固定机位，关键步骤推近特写，字幕同步标注参数｜BGM：轻快｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"播放量永远两位数？你输在前三秒","cat":"发布运营","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我朋友随手拍怎么跟老板请假爆了八十万，我精心剪的vlog全凉——输的不是内容，是前3秒。\n【3-12s 场景】差别就在：他开头直接上冲突，我开头先自我介绍两分钟——观众早跑了。\n【12-42s 口播】做号别自嗨。三个土办法：① 标题前五个字必须戳人，我同事比论职场强十倍；② 前3秒不放铺垫，直接甩冲突或反常识；③ 结尾留个钩子问题让人想评论。算法就爱看互动，你越端着它越不推。别追求完美，先发出来再说。完播和互动，比画质重要。\n【42-50s 升华+互动】你卡在播放量哪一步了？评论区说，我挨个看，帮你找病根。\n【画面/BGM/字幕】明快自媒体运营短片，4K，明亮均匀光，浅景深，手机与电脑屏幕实拍、界面特写，真实操作感；画面：分屏对比：左自介铺垫观众划走、右冲突开头留住；明亮，中景，节奏对比强烈｜机位：屏幕实拍或固定俯拍｜景别：特写（手机/电脑界面）｜运镜：固定，关键处推近界面｜表演：真实操作，不演｜焦段：屏幕特写用微距/2x，真人用广角｜灯光：明亮均匀柔光，无浓重阴影，屏幕不反光｜机位高度：俯拍屏幕45°/平视真人｜收音：领夹麦收口播，界面操作声保留｜剪辑节奏：关键界面推近，步骤切分屏，节奏明快｜BGM：轻快｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"标题不会写？记住人名加冲突","cat":"发布运营","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我标题写关于时间管理零播放，改成我同事靠这招准时下班爆了——标题差几个字，身价差十倍。\n【3-12s 场景】同样的货，换件衣服标题，身价天差地别，内容圈就这么现实。\n【12-42s 口播】爆款标题公式特简单：具体的人 + 具体的冲突/结果。别写如何减肥，写我妈三个月甩肉二十斤的野路子。带人称、带数字、带反差，人就想点。别做标题党骗人，但得会穿衣。你内容再好，title劝退也没人看。多备五个标题测，哪个猛用哪个。标题是门面，得支棱起来。\n【42-50s 升华+互动】你最烂的一个标题是啥？评论区晒，咱一起改，标题是门面。\n【画面/BGM/字幕】明快自媒体运营短片，4K，明亮均匀光，浅景深，手机与电脑屏幕实拍、界面特写，真实操作感；画面：标题界面前后对比（平淡标题 vs 冲突标题），真人操作手机；明亮，特写｜机位：屏幕实拍或固定俯拍｜景别：特写（手机/电脑界面）｜运镜：固定，关键处推近界面｜表演：真实操作，不演｜焦段：屏幕特写用微距/2x，真人用广角｜灯光：明亮均匀柔光，无浓重阴影，屏幕不反光｜机位高度：俯拍屏幕45°/平视真人｜收音：领夹麦收口播，界面操作声保留｜剪辑节奏：关键界面推近，步骤切分屏，节奏明快｜BGM：轻快｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"评论区比视频更值钱","cat":"发布运营","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我一条视频就三百播放，评论区聊炸了，算法反手推了波大的——评论区，是你和算法的谈判桌。\n【3-12s 场景】后来我学乖：结尾必抛问题，有人问必回，评论越多推越多。\n【12-42s 口播】别发完就跑，评论区是你和算法的谈判桌。结尾留个问题、置顶个神回复、认真回前几条，互动一上来，流量就滚起来。甚至故意留点小破绽让人想纠正你，评论更猛。别怕被杠，杠也是数据。把评论区当第二战场经营，比氪金投流实在。今天发完，记得蹲评论。\n【42-50s 升华+互动】你评论区最神的一条回复是啥？评论区晒，我偷师，也去蹲自己的评论。\n【画面/BGM/字幕】明快自媒体运营短片，4K，明亮均匀光，浅景深，手机与电脑屏幕实拍、界面特写，真实操作感；画面：手机评论区界面特写，弹幕式神回复滚动；明亮，近景，真实操作感｜机位：屏幕实拍或固定俯拍｜景别：特写（手机/电脑界面）｜运镜：固定，关键处推近界面｜表演：真实操作，不演｜焦段：屏幕特写用微距/2x，真人用广角｜灯光：明亮均匀柔光，无浓重阴影，屏幕不反光｜机位高度：俯拍屏幕45°/平视真人｜收音：领夹麦收口播，界面操作声保留｜剪辑节奏：关键界面推近，步骤切分屏，节奏明快｜BGM：轻快｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"更新比质量更要命","cat":"发布运营","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我憋大招一个月更一条，粉丝跑一半；隔壁日更水视频反而涨粉——算法认活人，不认完美。\n【3-12s 场景】算法认活人，你老不冒头，它当你凉了，直接不推。\n【12-42s 口播】新人起号，频率大于精致。先保更新，再磨质量，哪怕今天只发个三十秒碎碎念，也比断更好。断更超一周，权重掉一截，再来得从头养。定个自己扛得住的节奏，日更或隔日更，别贪多。稳定输出，算法才肯罩你。内容一般没关系，别失踪就行。先活下来，再变好。\n【42-50s 升华+互动】你最长断过多久？评论区坦白，以后别断，稳定输出比精致重要。\n【画面/BGM/字幕】明快自媒体运营短片，4K，明亮均匀光，浅景深，手机与电脑屏幕实拍、界面特写，真实操作感；画面：日历翻页动画与真人坚持日更，节奏明快；明亮，中景｜机位：屏幕实拍或固定俯拍｜景别：特写（手机/电脑界面）｜运镜：固定，关键处推近界面｜表演：真实操作，不演｜焦段：屏幕特写用微距/2x，真人用广角｜灯光：明亮均匀柔光，无浓重阴影，屏幕不反光｜机位高度：俯拍屏幕45°/平视真人｜收音：领夹麦收口播，界面操作声保留｜剪辑节奏：关键界面推近，步骤切分屏，节奏明快｜BGM：轻快｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"别一上来就变现，先当个人","cat":"发布运营","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我见一账号刚百粉就天天带货，评论区全是取关，活活把自己作死——观众不傻，你把他当提款机试试。\n【3-12s 场景】观众不傻，你把他当提款机，他早跑了，信任比粉丝数值钱。\n【12-42s 口播】起号先攒信任，别急着割。前几百粉就硬广，等于刚认识就要人钱，谁给？先持续输出价值、混个脸熟、让人信你，再自然带。哪怕带货，也得真用过、真说优缺点，别瞎吹。信任一旦崩，再涨粉难。慢点变现，长点情分，路才宽。你当人是人，人才当你号值得follow。\n【42-50s 升华+互动】你最烦哪种硬广？评论区吐槽，咱不学那种，先攒信任再变现。\n【画面/BGM/字幕】明快自媒体运营短片，4K，明亮均匀光，浅景深，手机与电脑屏幕实拍、界面特写，真实操作感；画面：对比：硬广刷屏掉粉 vs 真诚陪伴涨粉；明亮，中景，反差真实｜机位：屏幕实拍或固定俯拍｜景别：特写（手机/电脑界面）｜运镜：固定，关键处推近界面｜表演：真实操作，不演｜焦段：屏幕特写用微距/2x，真人用广角｜灯光：明亮均匀柔光，无浓重阴影，屏幕不反光｜机位高度：俯拍屏幕45°/平视真人｜收音：领夹麦收口播，界面操作声保留｜剪辑节奏：关键界面推近，步骤切分屏，节奏明快｜BGM：轻快｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"蹭热点要快，更要对味","cat":"发布运营","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】热点出来我犹豫三天，等我想蹭都凉了，流量早被别人薅秃——手慢无，是蹭热点的铁律。\n【3-12s 场景】后来我定规矩：热点两小时内出稿，慢了不如不发。\n【12-42s 口播】蹭热点拼手速，也拼角度。别瞎蹭无关的你硬凑，观众觉得你蹭得尴尬。挑和你赛道相关的，换个接地气视角说人话，比复制新闻强。热点前几小时流量最大，磨叽就错过了。但也别为了蹭丢底线，踩雷的事不碰。快、准、稳，热点才成跳板。今天有热点，你两小时内得动。\n【42-50s 升华+互动】你错过最可惜的一个热点是啥？评论区说，下回手快，两小时内出稿。\n【画面/BGM/字幕】明快自媒体运营短片，4K，明亮均匀光，浅景深，手机与电脑屏幕实拍、界面特写，真实操作感；画面：热点时间轴与真人两小时内出稿，节奏紧凑；明亮，中景｜机位：屏幕实拍或固定俯拍｜景别：特写（手机/电脑界面）｜运镜：固定，关键处推近界面｜表演：真实操作，不演｜焦段：屏幕特写用微距/2x，真人用广角｜灯光：明亮均匀柔光，无浓重阴影，屏幕不反光｜机位高度：俯拍屏幕45°/平视真人｜收音：领夹麦收口播，界面操作声保留｜剪辑节奏：关键界面推近，步骤切分屏，节奏明快｜BGM：轻快｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"封面不点，内容白干","cat":"发布运营","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我视频内容不错，封面用默认帧点击惨淡，换张大字人脸图播放翻倍——封面三毫秒定生死。\n【3-12s 场景】观众滑得比翻书快，封面三毫秒定生死，你糊弄它就糊弄你。\n【12-42s 口播】封面就三要素：清晰人脸或主体 + 大字痛点 + 高对比配色。别用花里胡哨的，越简单越抓眼。字别多，七个字内说清凭啥点你。真人出镜配表情包式大字，转化最稳。你花十分钟调封面，可能顶两小时剪辑。门面支棱起来，内容才有人进。今天发，先抠封面。\n【42-50s 升华+互动】你最丑的一个封面是啥？评论区晒，我帮你改，门面得支棱。\n【画面/BGM/字幕】明快自媒体运营短片，4K，明亮均匀光，浅景深，手机与电脑屏幕实拍、界面特写，真实操作感；画面：封面前后对比（默认帧 vs 大字人脸图），点击率差异；明亮，特写｜机位：屏幕实拍或固定俯拍｜景别：特写（手机/电脑界面）｜运镜：固定，关键处推近界面｜表演：真实操作，不演｜焦段：屏幕特写用微距/2x，真人用广角｜灯光：明亮均匀柔光，无浓重阴影，屏幕不反光｜机位高度：俯拍屏幕45°/平视真人｜收音：领夹麦收口播，界面操作声保留｜剪辑节奏：关键界面推近，步骤切分屏，节奏明快｜BGM：轻快｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"数据复盘，别只看播放","cat":"发布运营","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我以前只看播放量乐呵，后来发现完播率才决定推不推——数据是说实话的，它不哄你。\n【3-12s 场景】一条播放不高但完播过的，反而被持续推，播放低的反而停了。\n【12-42s 口播】后台别只盯播放，看这仨：完播率(内容抓不抓人)、互动率(有没有共鸣)、涨粉率(值不值得follow)。完播低就砍前摇、加钩子；互动低就多抛问题；涨粉低就想想人设为啥不讨喜。数据是说实话的，它告诉你观众用脚投票。每周复盘一次，比瞎更强。读懂数据，号才长脑子。\n【42-50s 升华+互动】你最看不懂哪个数据？评论区问，我下期讲，读懂数据号才长脑子。\n【画面/BGM/字幕】明快自媒体运营短片，4K，明亮均匀光，浅景深，手机与电脑屏幕实拍、界面特写，真实操作感；画面：数据后台界面特写，完播/互动/涨粉指标高亮；明亮，近景，真实｜机位：屏幕实拍或固定俯拍｜景别：特写（手机/电脑界面）｜运镜：固定，关键处推近界面｜表演：真实操作，不演｜焦段：屏幕特写用微距/2x，真人用广角｜灯光：明亮均匀柔光，无浓重阴影，屏幕不反光｜机位高度：俯拍屏幕45°/平视真人｜收音：领夹麦收口播，界面操作声保留｜剪辑节奏：关键界面推近，步骤切分屏，节奏明快｜BGM：轻快｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"合集比单条更养粉","cat":"发布运营","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我零散发一堆粉丝看完就走，做成系列留存翻倍——人爱追连续剧，你给个追的理由。\n【3-12s 场景】人爱追连续剧，你做成系列，他就惦记下集，粘性一下子上来。\n【12-42s 口播】把零散内容打包成合集/系列，给观众一个追的理由。比如新手养猫九问、离婚前必看三件事，一集钩一集。合集还能吃搜索长尾，老内容持续被翻出来。别只发孤岛视频，串成线。你给结构，观众给忠诚。今天就把同主题归个合集，老粉新粉都好啃。系列化，才叫运营。\n【42-50s 升华+互动】你最想做哪个系列？评论区说，我帮你想第一集，串成线才叫运营。\n【画面/BGM/字幕】明快自媒体运营短片，4K，明亮均匀光，浅景深，手机与电脑屏幕实拍、界面特写，真实操作感；画面：合集 playlist 界面与真人追更，留存可视化；明亮，中景｜机位：屏幕实拍或固定俯拍｜景别：特写（手机/电脑界面）｜运镜：固定，关键处推近界面｜表演：真实操作，不演｜焦段：屏幕特写用微距/2x，真人用广角｜灯光：明亮均匀柔光，无浓重阴影，屏幕不反光｜机位高度：俯拍屏幕45°/平视真人｜收音：领夹麦收口播，界面操作声保留｜剪辑节奏：关键界面推近，步骤切分屏，节奏明快｜BGM：轻快｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"别抄，抄死得快","cat":"发布运营","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我早期搬运别人爆款流量还行，结果被原创举报号直接凉透——平台专治抄袭，白干。\n【3-12s 场景】平台现在查重比你还熟，抄来的粉丝不认你，一原创就现原形。\n【12-42s 口播】搬运抄近路，死得也快。平台算法专治抄袭，轻则限流重则封号，白干。你要学的是套路不是原文——看人家结构、角度、节奏，用自己的话、自己的事重讲。原创哪怕粗糙，也是你的资产，越积越值钱。别贪那点懒，把脑子用上。原创慢点，但走得远。今天起，说自己的话。\n【42-50s 升华+互动】你抄过最离谱的一次是啥？评论区坦白，以后原创，慢点但走得远。\n【画面/BGM/字幕】明快自媒体运营短片，4K，明亮均匀光，浅景深，手机与电脑屏幕实拍、界面特写，真实操作感；画面：原创手写稿 vs 搬运查重红叉对比；明亮，中景，警示感｜机位：屏幕实拍或固定俯拍｜景别：特写（手机/电脑界面）｜运镜：固定，关键处推近界面｜表演：真实操作，不演｜焦段：屏幕特写用微距/2x，真人用广角｜灯光：明亮均匀柔光，无浓重阴影，屏幕不反光｜机位高度：俯拍屏幕45°/平视真人｜收音：领夹麦收口播，界面操作声保留｜剪辑节奏：关键界面推近，步骤切分屏，节奏明快｜BGM：轻快｜字幕：字幕，关键句高亮，70% 静音可懂"},{"title":"相亲市场比双十一还卷","cat":"搞笑类","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我妈给我列了张相亲简历，比她自己退休申请还认真——身高178、不养妈、还得会哄她。\n【3-12s 场景】到了饭店一看，人挺好，开口第一句：你有房吗？我说有，蚂蚁花呗的。\n【12-42s 口播】现在的相亲市场，比双十一还卷。条件写得比简历长：身高178+、月薪过万、不生二胎、会做饭、还得陪逛街不喊累。我就想问，这找的是对象还是全能保姆？最后我没相成，但我妈成功给我介绍了她同事家的狗——说至少它听话。行吧，狗就狗，起码不查我征信。单身这么多年，原来输给了一条狗。\n【42-50s 升华+互动】你妈给你列过最离谱的相亲条件是啥？评论区贴出来，我看看谁家比我家疯。\n【画面/BGM/字幕】手持第一人称 vlog 短片，4K，手持自拍视角，轻微晃动与呼吸感运镜，自然光／室内暖白光，生活流真实跟拍，不刻意打光、不摆拍；画面：真人举着打印的相亲条件清单对着镜头苦笑摇头，背景虚化简历墙｜机位：手持自拍（手机举到脸前）｜景别：近景（肩以上+手里清单入镜）｜运镜：说话时镜头轻微上下呼吸晃，念到“征信”时镜头推近清单特写｜表演：从无奈苦笑到摊手认命，自然不演｜焦段：手机主摄广角(等效24-28mm)自拍感，特写用2x｜灯光：不刻意打光，利用自然光/室内暖白光，避补光破坏真实感｜机位高度：手持举脸前(约眼高略低)，跟拍随动作起伏｜收音：手机自带麦保留环境真实感，嘈杂加领夹麦｜剪辑节奏：保留呼吸感晃动，关键笑点/反转加音效+画面抖，每5-8s一个梗｜BGM：轻快日常 vlog 配乐，带微悬疑喜剧节拍，人声优先、BGM 压至 20% 音量，不盖口播｜字幕：大字白底黑边，70% 静音可懂，钩子与反转句高亮黄底，关键情绪词加大"},{"title":"我爸的养生，全靠转发","cat":"搞笑类","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我爸转发养生文给我，标题是《紧急！这三类人活不过明年》——点开一看，三类人包括呼吸的。\n【3-12s 场景】他据此立了一堆规矩，结果自己半夜偷吃姜糖片，被我逮个正着。\n【12-42s 口播】我爸的养生知识，全来自群聊转发，比教科书还自信。他说手机放枕头边致癌，转头买个最厚手机壳继续放。你说他他不听，你说科学家说的，他回专家还收费呢。我家养生全靠玄学，运动靠看别人跳，吃药靠朋友圈。最后还是我偷偷给他预约了体检——真有问题，转发治不了。各位，听我的，别让你爸当家庭首席谣言官。\n【42-50s 升华+互动】你家谁是家族养生谣言CEO？评论区点名，我拉个群一起科普他。\n【画面/BGM/字幕】手持第一人称 vlog 短片，4K，手持自拍视角，轻微晃动与呼吸感运镜，自然光／室内暖白光，生活流真实跟拍，不刻意打光、不摆拍；画面：老爸戴老花镜刷手机、半夜偷摸吃姜糖片被抓包，表情从得意到心虚｜机位：手持跟拍（手机举胸前跟拍老爸）｜景别：中近景（老爸上半身+手机屏幕入镜）｜运镜：跟随走动轻微晃，偷吃时镜头悄悄推近特写｜表演：先得意晃手机，被逮瞬间僵住、眨巴眼装没事｜焦段：手机主摄广角(等效24-28mm)自拍感，特写用2x｜灯光：不刻意打光，利用自然光/室内暖白光，避补光破坏真实感｜机位高度：手持举脸前(约眼高略低)，跟拍随动作起伏｜收音：手机自带麦保留环境真实感，嘈杂加领夹麦｜剪辑节奏：保留呼吸感晃动，关键笑点/反转加音效+画面抖，每5-8s一个梗｜BGM：轻快日常 vlog 配乐，带微悬疑喜剧节拍，人声优先、BGM 压至 20% 音量，不盖口播｜字幕：大字白底黑边，70% 静音可懂，钩子与反转句高亮黄底，关键情绪词加大"},{"title":"减肥这事儿，我输给了一碗面","cat":"搞笑类","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我减肥失败的原因找到了：不是馋，是我家楼下老板娘喊的那声“老样子”，比任何情话都管用。\n【3-12s 场景】老板娘一句老样子，我防线全崩，一斤没少，还加了份卤蛋。\n【12-42s 口播】我的减肥史，就是一部失败史。计划写得满满，执行败给一碗面。饭前雄心壮志，闻见香味全是草。什么帕梅拉、刘畊宏，都不如楼下面馆老板娘一句来了杀伤力大。后来我想通了，与其和食欲硬刚，不如和它谈判：今天吃面，明天多走两站。别跟自己较劲到暴食，松弛点反而能坚持。面子是别人的，肚子是自己的，吃饱了才有力气瘦。啊不对，是先瘦才能吃。\n【42-50s 升华+互动】你减肥败给过哪种吃的？评论区说出来，我看看谁比我更没出息——我先招，一碗阳春面。\n【画面/BGM/字幕】手持第一人称 vlog 短片，4K，手持自拍视角，轻微晃动与呼吸感运镜，自然光／室内暖白光，生活流真实跟拍，不刻意打光、不摆拍；画面：真人面对镜头眼神投降，低头吸溜面条、 tle":"购物的快乐，只在拆快递那三秒","cat":"搞笑类","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我买过最没用的东西，是那个号称“治愈焦虑”的捏捏乐——捏完我更焦虑了，因为快递盒都没扔。\n【3-12s 场景】快递堆成山，我回忆不起买它干啥，只记得下单那股老子值得的爽。\n【12-42s 口播】成年人的快乐，大半是快递给的，也就拆那三秒。下单时觉得自己会用到，到手发现我买这干啥。什么发圈十件套、厨房神器、网红小夜灯，最终归宿是抽屉深处。但我还是买，因为穷开心也是开心。建议：下单前放购物车晾一夜，第二天还想要再买——八成你就不想了，钱和抽屉都保住了。别问我是怎么知道的，问就是抽屉满了。\n【42-50s 升华+互动】你买过最鸡肋的一样是啥？评论区晒图，我看看谁家抽屉和我一样是废品回收站。\n【画面/BGM/字幕】手持第一人称 vlog 短片，4K，手持自拍视角，轻微晃动与呼吸感运镜，自然光／室内暖白光，生活流真实跟拍，不刻意打光、不摆拍；画面：真人被快递山包围，拆开是鸡肋时表情垮掉，举着废品对镜头无奈｜机位：手持跟拍（手机举胸前环绕拍）｜景别：中近景（真人+周围快递堆）｜运镜：拆件时镜头随手轻晃下移特写内容物，表情从期待到落差｜表演：拆前期待搓手，拆后垮脸举废品｜焦段：手机主摄广角(等效24-28mm)自拍感，特写用2x｜灯光：不刻意打光，利用自然光/室内暖白光，避补光破坏真实感｜机位高度：手持举脸前(约眼高略低)，跟拍随动作起伏｜收音：手机自带麦保留环境真实感，嘈杂加领夹麦｜剪辑节奏：保留呼吸感晃动，关键笑点/反转加音效+画面抖，每5-8s一个梗｜BGM：轻快日常 vlog 配乐，带微悬疑喜剧节拍，人声优先、BGM 压至 20% 音量，不盖口播｜字幕：大字白底黑边，70% 静音可懂，钩子与反转句高亮黄底，关键情绪词加大"},{"title":"我的厨艺，全靠外卖商家教","cat":"搞笑类","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我第一次煮面，水少变焖面、水多变汤，我妈视频看了一眼说：你还是点吧。\n【3-12s 场景】我妈视频看我操作，沉默三秒说你还是点吧，那是她第一次认输。\n【12-42s 口播】我这双手，拿筷子行，拿锅铲废。所谓做饭，就是从随便炒炒到凑合能吃。盐放多了加水，水加多了加面，最后发明了一锅不知名料理。我妈远程指导，讲到第三遍她自己放弃了，说你是饿不死的，有外卖。行吧，厨艺这块，我认输。但我会点啊，这年头会点也是项技能。就是钱包瘦了点。各位，别笑，你敢说你没煮糊过？\n【42-50s 升华+互动】你做过最黑暗的料理是啥？评论区比惨，我先交作业——一碗会移动的炒饭。\n【画面/BGM/字幕】手持第一人称 vlog 短片，4K，手持自拍视角，轻微晃动与呼吸感运镜，自然光／室内暖白光，生活流真实跟拍，不刻意打光、不摆拍；画面：真人举着焦黑不明物对镜头尴尬笑，画中画老妈摇头｜机位：手持自拍（手机对脸+锅入镜）｜景别：近景（脸+手中黑暗料理碗）｜运镜：端出料理时镜头轻晃下移特写，画中画老妈摇头时切分屏｜表演：举碗尴尬笑，嘴硬“能吃”｜焦段：手机主摄广角(等效24-28mm)自拍感，特写用2x｜灯光：不刻意打光，利用自然光/室内暖白光，避补光破坏真实感｜机位高度：手持举脸前(约眼高略低)，跟拍随动作起伏｜收音：手机自带麦保留环境真实感，嘈杂加领夹麦｜剪辑节奏：保留呼吸感晃动，关键笑点/反转加音效+画面抖，每5-8s一个梗｜BGM：轻快日常 vlog 配乐，带微悬疑喜剧节拍，人声优先、BGM 压至 20% 音量，不盖口播｜字幕：大字白底黑边，70% 静音可懂，钩子与反转句高亮黄底，关键情绪词加大"},{"title":"我的健身卡，是最贵的装饰品","cat":"搞笑类","date":"2026-08-18","source":"原创选题","kind":"topic","content":"【总时长】约 50 秒\n【0-3s 钩子】我健身卡年费两千，一年去了三次，算下来一次六百六——比按摩还贵，还疼。\n【3-12s 场景】有回真去了，跑步机走十分钟，拍九张照，发完朋友圈——今天的健身圆满。\n【12-42s 口播】我的健身卡，年费两千，使用三次，均摊一次六百六，比按摩还贵。每次去主打一个打卡式健身：拍个照、发个圈、心安理得躺平。器材看我像看稀客。后来我悟了，不去就不去，别用办卡自我感动。真想动，下楼遛弯不要钱。省下办卡钱，买双舒服鞋，起码天天穿。健身   '发布运营':['#自媒体','#起号','#小红书运营','#内容创作','#涨粉'],
  '搞笑类':['#搞笑','#沙雕日常','#打工人','#段子','#快乐源泉']
};
// 关键词红色高亮（小红书"重点词标红"习惯，保守匹配情绪/强调词）
const HL_WORDS = ['真的','别','最','一定要','记住','狠','绝了','救命','其实','反而','才是','根本','果然','要命','上头','扎心','破防','离谱','爽','绝','狠人','谁懂','破大防'];
function getSeg(c,name){
  const re = new RegExp('【'+name+'】([\\s\\S]*?)(?=\\n?【|$)');
  const m = c.match(re); return m ? m[1].trim() : '';
}
function splitSpoken(text){
  const parts = text.split(/(?<=[。！？])/).filter(s=>s.trim());
  if(parts.length<=1) return [text];
  const mid=Math.ceil(parts.length/2);
  let a=parts.slice(0,mid).join(''), b=parts.slice(mid).join('');
  if(a.length<8 && b.length>0){ const half=Math.ceil(b.length/2); a+=b.slice(0,half); b=b.slice(half); }
  return [a,b].filter(s=>s.trim());
}
function clean(t){ return (t||'').replace(/[｜|]/g,' ').replace(/\s+/g,' ').trim(); }
function esc(s){return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function hl(s){
  let r=esc(s);
  HL_WORDS.forEach(w=>{ if(w && r.indexOf(w)>=0) r=r.split(w).join('<span class="hl">'+w+'</span>'); });
  return r;
}

let curIdx=0, curList=[];
const catSel=document.getElementById('catSel');
const cardSel=document.getElementById('cardSel');
const cats=[...new Set(TOPICS.map(t=>t.cat))];
cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o);});

function loadCat(){
  const cat=catSel.value;
  curList=TOPICS.filter(t=>t.cat===cat);
  cardSel.innerHTML='';
  curList.forEach((t,i)=>{const o=document.createElement('option');o.value=i;
    o.textContent=(t.title||('选题'+(i+1)));cardSel.appendChild(o);});
  curIdx=0; render();
}
function render(){
  const t=curList[curIdx]; if(!t) return;
  const c=t.content||'';
  const hook=getSeg(c,'0-3s 钩子'), scene=getSeg(c,'3-12s 场景');
  const spoken=getSeg(c,'12-42s 口播'), inter=getSeg(c,'42-50s 升华+互动');
  const cat=t.cat, color=CAT_COLOR[cat]||'#ff2e4d', emoji=CAT_EMOJI[cat]||'✨';
  const spokenChunks=splitSpoken(spoken);
  const pages=[];
  pages.push({t:'cover',txt:clean(hook),label:emoji+' '+cat});
  if(scene) pages.push({t:'scene',txt:clean(scene),label:'📍 真实场景'});
  spokenChunks.forEach((s,i)=>pages.push({t:'spoken',txt:clean(s),label:'🎙 口播 '+(i+1)+'/'+spokenChunks.length}));
  if(inter) pages.push({t:'interact',txt:clean(inter),label:'💬 互动引导'});
  const box=document.getElementById('pages'); box.innerHTML='';
  pages.forEach((p,i)=>{
    const d=document.createElement('div'); d.className='page '+p.t+' xhs';
    d.style.setProperty('--c',color);
    let inner='<div class="topbar"></div>';
    inner+='<div class="badge">'+esc(p.label)+'</div>';
    if(p.t==='cover'){
      inner+='<div class="body"><div class="txt">'+hl(p.txt)+'</div></div>';
      inner+='<div class="emojirow">'+(emoji+' '+CAT_EMOJI[cat]+' ✨ 🔥 💡')+'</div>';
    }
    else if(p.t==='interact'){
      inner+='<div class="label">'+esc(p.label)+'</div><div class="body"><div class="qbox">'+hl(p.txt)+'</div></div>';
    }
    else {
      inner+='<div class="label">'+esc(p.label)+'</div><div class="body"><div class="txt">'+hl(p.txt)+'</div></div>';
    }
    inner+='<div class="foot">@GLUCK 的图文笔记</div><div class="pagenum">'+(i+1)+'/'+pages.length+'</div>';
    d.innerHTML=inner;
    const wrap=document.createElement('div');
    wrap.style.cssText='display:flex;flex-direction:column;align-items:center;';
    wrap.appendChild(d);
    const btn=document.createElement('button'); btn.textContent='保存这张'; btn.style.marginTop='8px';
    btn.onclick=()=>savePage(d);
    wrap.appendChild(btn);
    box.appendChild(wrap);
  });
  // side panel
  document.getElementById('titleOut').textContent='「'+clean(hook).slice(0,28)+'」——来自'+cat+'选题';
  const body=[clean(hook),clean(scene),clean(spoken),clean(inter),
    '觉得有用点个收藏⭐，评论区聊聊你的看法~'].filter(s=>s).join('\n\n');
  document.getElementById('bodyOut').value=body;
  const tags=(CAT_TAGS[cat]||['#干货']).concat(['#GLUCK题库']);
  const tagBox=document.getElementById('tagOut'); tagBox.innerHTML='';
  tags.forEach(tg=>{const s=document.createElement('span');s.className='tag';s.textContent=tg;tagBox.appendChild(s);});
  document.getElementById('pubTip').innerHTML=
    '建议时间：工作日 12:00-13:00、20:00-22:00；周末 9:00-11:00、20:00-23:00。<br>封面用第 1 张（大字钩子），前 3 张决定点击，结尾图抛问题拉评论权重（小红书评论=4分、关注=8分）。';
  document.getElementById('srcOut').textContent='选题来源：'+ (t.source||'GLUCK·运营思路题库')+' · '+ (t.date||'');
}
function savePage(el){
  if(typeof html2canvas!=='function'){alert('截图库未加载（需联网）。请直接用系统截图工具截取。');return;}
  html2canvas(el,{scale:3,backgroundColor:'#ffffff',logging:false}).then(cv=>{
    const a=document.createElement('a'); a.download='xhs_'+(curIdx+1)+'_'+Date.now()+'.png';
    a.href=cv.toDataURL('image/png'); a.click();
  });
}
catSel.onchange=loadCat;
cardSel.onchange=()=>{curIdx=+cardSel.value; render();};
document.getElementById('prevBtn').onclick=()=>{curIdx=(curIdx-1+curList.length)%curList.length;cardSel.value=curIdx;render();};
document.getElementById('nextBtn').onclick=()=>{curIdx=(curIdx+1)%curList.length;cardSel.value=curIdx;render();};
document.getElementById('randBtn').onclick=()=>{curIdx=Math.floor(Math.random()*curList.length);cardSel.value=curIdx;render();};
document.getElementById('copyBody').onclick=()=>{const ta=document.getElementById('bodyOut');ta.select();document.execCommand('copy');alert('正文已复制');};

// 线上打开时尝试拉取最新 data.json 覆盖本地内置数据
(async function refresh(){
  try{
    const r=await fetch('./data.json',{cache:'no-store'});
    if(r.ok){const j=await r.json();const ops=(j.operationIdeas||[]).filter(o=>o.kind==='topic');
      if(ops.length){TOPICS.length=0;ops.forEach(o=>TOPICS.push(o));cats.length=0;
        [...new Set(ops.map(o=>o.cat))].forEach(c=>cats.push(c));
        catSel.innerHTML='';cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o);});
        loadCat();}
    }
  }catch(e){/* 离线用内置数据 */}
})();

loadCat();
</script>
</body>
</html>
