  <text x="400" y="467" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif" font-size="25" font-weight="400" fill="#C9A24B" letter-spacing="2">每个深夜，讲一个你没听过的故事</text>
